<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Everton Tibolla</title>
  <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>

  <main class="home-center">
    <div class="form-box">
      <h2>Login</h2>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="text" id="email" name="email" placeholder="seu@email.com">
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="••••••••">
      </div>

      <div class="btn-row">
        <a href="./home.html">
          <button class="primary" type="button" style="width:100%">Entrar</button>
        </a>
        <a href="./register.html">
          <button type="button" style="width:100%">Registrar</button>
        </a>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; Everton Tibolla</p>
  </footer>

  <button id="dark-toggle">◑ Claro</button>
  <div id="font-controls">
    <button id="font-increase">A+</button>
    <button id="font-decrease">A-</button>
  </div>

  <script src="../js/script.js"></script>
</body>
</html>
